# Fly.io config for Spotlight.
# Rename `app` to something unique (fly launch will offer to do this), then:
#   fly secrets set TM_KEY=... SEATGEEK_CLIENT_ID=...
#   fly deploy
# The Supabase URL + anon key are public, so pass them as build args
# (they get baked into the static bundle by Vite):
#   fly deploy --build-arg VITE_SUPABASE_URL=... --build-arg VITE_SUPABASE_ANON_KEY=...
# Accounts + favorites live in Supabase, so no persistent volume is needed.
app = "spotlight-edm-30822"
primary_region = "ewr"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"
