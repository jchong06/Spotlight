<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Spotlight — find the night</title>
    <meta name="description" content="Live EDM shows near you, aggregated from Ticketmaster and SeatGeek." />

    <!-- installable web app (Add to Home Screen) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c0b10" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spotlight" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // apply saved theme before paint to avoid a flash
      try {
        document.documentElement.setAttribute("data-theme", localStorage.getItem("spotlight-theme") || "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
